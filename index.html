<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#161614">
  <title>Flipbook</title>

  <script>
    (function () {
      var theme = localStorage.getItem("flipbook-theme") === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="book-info">
        <h1 id="book-title">Flipbook</h1>
        <label class="language-picker" for="language-select">
          <span class="visually-hidden" data-i18n="language">Language</span>
          <select id="language-select" aria-label="Language">
            <option value="en">English</option>
            <option value="es">Español</option>
          </select>
        </label>
        <span id="status-text" class="status-text">Preparing…</span>
      </div>

      <div class="toolbar-actions" aria-label="Book controls" data-i18n-attr="aria-label:bookControls">
        <button id="first-button" class="icon-button" type="button" aria-label="First page" title="First page">
          <span aria-hidden="true">⏮</span>
        </button>

        <button id="prev-button" class="icon-button" type="button" aria-label="Previous page" title="Previous page">
          <span aria-hidden="true">←</span>
        </button>

        <span id="page-counter" class="page-counter" aria-live="polite">— / —</span>

        <button id="next-button" class="icon-button" type="button" aria-label="Next page" title="Next page">
          <span aria-hidden="true">→</span>
        </button>

        <button id="last-button" class="icon-button" type="button" aria-label="Last page" title="Last page">
          <span aria-hidden="true">⏭</span>
        </button>

        <button id="theme-button" class="icon-button" type="button" aria-label="Light mode" title="Light mode">
          ☀
        </button>

        <button id="fullscreen-button" class="text-button" type="button">
          Fullscreen
        </button>
      </div>
    </header>

    <section id="viewer" class="viewer" aria-label="PDF reader" data-i18n-attr="aria-label:pdfReader">
      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading-line">
          <span id="loading-label">Loading PDF…</span>
          <span id="loading-percent">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div id="book" class="book" hidden></div>

      <div id="error-panel" class="error-panel" hidden>
        <h2 id="error-title" data-i18n="openBookError">Unable to open the book.</h2>
        <p id="error-message"></p>
        <p id="error-hint" class="error-hint">
          Make sure the PDF is inside the <code>books/</code> folder and that the name used in
          <code>?book=filename.pdf</code> is correct.
        </p>
      </div>
    </section>

    <footer class="footer">
      <span data-i18n="footerHint">Drag the page corner, swipe on mobile, or use the keyboard arrows.</span>
    </footer>
  </main>
</body>
</html>
